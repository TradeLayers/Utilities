services:
  db:
    image: postgres:17-alpine
    command: -p 5433
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tradelayers
    ports:
      - "5433:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -p 5433"]
      interval: 2s
      timeout: 5s
      retries: 10

  backend:
    build: ../BE
    ports:
      - "5000:5000"
    volumes:
      - ../BE/logs:/app/logs
    environment:
      FRONTEND_URL: http://localhost:3002
      DB_HOST: db
      DB_PORT: 5433
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: tradelayers
      DB_SSLMODE: disable
      APP_PORT: 5000
      FINNHUB_API_KEY: ${FINNHUB_API_KEY}
      FINNHUB_WS_URL: wss://ws.finnhub.io
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../FE
      args:
        VITE_API_URL: /api
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
